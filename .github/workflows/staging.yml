name: Staging — Build e Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build dos Serviços e Deploy em Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Empacotar serviços (sem testes — já validados pelo CI)
        run: mvn -pl user-service,resource-service,allocation-service package -DskipTests -B
        working-directory: ${{ github.workspace }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalizar owner para minúsculo
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push — user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/sarc-user-service:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — resource-service
        uses: docker/build-push-action@v5
        with:
          context: ./resource-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/sarc-resource-service:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — allocation-service
        uses: docker/build-push-action@v5
        with:
          context: ./allocation-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/sarc-allocation-service:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo do deploy
        run: |
          echo "## 🚀 Deploy de Staging Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Serviço | Imagem |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | \`ghcr.io/${{ steps.owner.outputs.value }}/sarc-user-service:staging\` |" >> $GITHUB_STEP_SUMMARY
          echo "| resource-service | \`ghcr.io/${{ steps.owner.outputs.value }}/sarc-resource-service:staging\` |" >> $GITHUB_STEP_SUMMARY
          echo "| allocation-service | \`ghcr.io/${{ steps.owner.outputs.value }}/sarc-allocation-service:staging\` |" >> $GITHUB_STEP_SUMMARY
